<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>

<style>
:root {
    --bg: #0d0d0f;
    --text: #f5f5f7;
    --sub: #86868b;
    --accent: #8ab4ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 40px 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* 标题 */
.hero {
    margin-bottom: 60px;
}

.hero h1 {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -1px;
}

.hero p {
    margin-top: 10px;
    color: var(--sub);
    font-size: 18px;
}

/* 分区 */
.section {
    margin-bottom: 60px;
}

.section h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: var(--sub);
    font-weight: 500;
}

/* 卡片 */
.card {
    padding: 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    margin-bottom: 20px;
    transition: 0.3s;
}

.card:hover {
    background: rgba(255,255,255,0.06);
    transform: translateY(-2px);
}

/* 音乐列表 */
.music-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.music-item span {
    color: var(--sub);
}

/* footer */
.footer {
    margin-top: 80px;
    text-align: center;
    color: var(--sub);
    font-size: 14px;
}

/* 小动画 */
.fade {
    opacity: 0;
    transform: translateY(10px);
    animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 首页 -->
    <div class="hero fade">
        <h1>Greg</h1>
        <p>still figuring things out.</p >
    </div>

    <!-- 关于我 -->
    <div class="section fade">
        <h2>About</h2>
        <div class="card">
            <p>
                我不太擅长用标签定义自己。  
                比起“是什么”，我更在意“为什么会变成这样”。
            </p >
            <br>
            <p>
                对人、关系、情绪，有长期兴趣。  
                最近在思考：理性和依赖之间，到底哪里是边界。
            </p >
        </div>
    </div>

    <!-- 音乐 -->
    <div class="section fade">
        <h2>Music</h2>
        <div class="card">
            <div class="music-item">
                <div>Bones</div>
                <span>Imagine Dragons</span>
            </div>
            <div class="music-item">
                <div>（你可以换成你喜欢的）</div>
                <span>Artist</span>
            </div>
            <div class="music-item">
                <div>...</div>
                <span></span>
            </div>
        </div>
    </div>

    <!-- 想法 -->
    <div class="section fade">
        <h2>Notes</h2>
        <div class="card">
            <p>
                有时候，人并不是在靠近谁，  
                而是在试图确认：  
                自己是不是被需要。
            </p >
        </div>
    </div>

    <!-- 联系 -->
    <div class="section fade">
        <h2>Contact</h2>
        <div class="card">
            <p>Email: your@email.com</p >
            <p>WeChat: ******</p >
        </div>
    </div>

    <div class="footer">
        <p>© 2026</p >
    </div>

</div>

</body>
</html>
